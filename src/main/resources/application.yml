spring:
  application.name: demo2
  mvc:
    servlet:
      path: /api
  profiles:
    active: local
  # DataSource Config
  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:4000/thumbSystem
    username: leikooo
    password: YourPass123
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/biz_retry_task.sql
  data:
    redis:
      # 单节点配置 (注释掉，使用集群配置)
      # host: 127.0.0.1
      # port: 17001

      # Redis Cluster 配置
      cluster:
        nodes: 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005,127.0.0.1:7006
        max-redirects: 3

      connect-timeout: 5000ms
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16  # 增加连接池大小以支持集群
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
# mybatis-plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# knife4j 的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  port: 9199
# 整合 Prometheus + Grafana
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    # 所有指标统一附加的公共标签，PromQL 中的 application / env 即来源于此
    tags:
      application: demo2
      env: local
    distribution:
      # histogram_quantile(P99) 依赖 _bucket，必须开启
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5, 0.75, 0.9, 0.95, 0.99
# Prometheus HTTP API 查询配置（Agent 工具使用）
prometheus:
  base-url: http://localhost:9090
  timeout: 3s
  job: demo2
  application: demo2
  env: local
  default-qps-window: 1m
  default-success-window: 5m
  default-endpoint-window: 5m
  default-step: 15s
# Agent 本地日志查询配置
agent:
  logs:
    dir: logs
    file-pattern: "*.log*"
    max-files: 10
    max-lines-per-file: 1000000
    max-limit: 100
    max-line-chars: 4096
